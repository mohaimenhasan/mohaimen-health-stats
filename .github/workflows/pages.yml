name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node --test tests/test_fitness.mjs worker/test/worker.test.mjs
      - name: Decrypt site data (data.enc -> site/data)
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: python -m healthstats.vault open --only site/data
      - name: Privacy audit (blocks deploy if anything personal slipped in)
        run: python -m healthstats.privacy site config
      - name: Seal site data for the access Worker (site/data -> site/fitness.enc)
        run: |
          python -m healthstats.vault pack
          rm -rf site/data
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
